<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="stlye.css">
    <title>Codewars Score</title>
</head>

<body>
    <div class="format">
        <header>
            <nav>
                <ul>
                    <li><a href="#" id="showLanguages">Nyelvek</a></li>
                    <li><a href="#" id="showTotalScore">Összpontszám</a></li>
                </ul>
            </nav>
        </header>


        <h1>Codewars Score</h1>

        <label for="user">Felhasználó neve:</label> <br>
        <input type="text" name="user" id="user"> <br>
        <button id="fetchData">Keresés</button>

        <br>
        <div class="summary">
            <div class="name">
                <p id="userName">Felhasználó</p>
            </div>

            <div class="skills">
                <ul id="userSkills">Nyelvek</ul>
            </div>

            <div class="osszpont">
                <p id="userScore">Összpontszám</p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
